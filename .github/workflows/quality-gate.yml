name: Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start production server
        run: npm run start -- --hostname 127.0.0.1 --port 3000 &

      - name: Performance budget
        env:
          PERF_BASE_URL: http://127.0.0.1:3000
          PERF_ROUTES: /,/login,/register
          PERF_MIN_SCORE: "0.35"
          PERF_MAX_LCP: "12000"
          PERF_MAX_CLS: "0.1"
          PERF_MAX_TBT: "5000"
        run: npm run perf:budget

      - name: Performance budget (authenticated dashboard)
        if: ${{ secrets.E2E_LOGIN_EMAIL != '' && secrets.E2E_LOGIN_PASSWORD != '' }}
        env:
          PERF_BASE_URL: http://127.0.0.1:3000
          PERF_AUTH_ROUTES: /dashboard,/dashboard/calendar,/dashboard/business
          PERF_AUTH_MIN_SCORE: "0.25"
          PERF_AUTH_MAX_LCP: "14000"
          PERF_AUTH_MAX_CLS: "0.15"
          PERF_AUTH_MAX_TBT: "7000"
          E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
        run: npm run perf:budget:auth

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: |
            .perf-reports/
            .perf-reports-auth/
          if-no-files-found: ignore

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
